[project]
name = "business-matcher"
version = "0.1.0"
description = "Automated business record matching using fuzzy algorithms and web scraping"
requires-python = ">=3.10"
authors = [
    {name = "Shaily Sharma", email = "shailysharmawork@gmail.com"}
]
license = {text = "MIT"}
dependencies = [
    "pandas>=2.1.0",
    "rapidfuzz>=3.5.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
